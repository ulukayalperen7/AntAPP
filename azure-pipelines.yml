trigger:
  branches:
    include:
      - main

variables:
  - group: antapp-prod
  - name: IMAGE_TAG
    value: $(Build.BuildId)

stages:
  - stage: Build
    displayName: Build & Push Docker Images
    jobs:
      - job: BuildAndPush
        displayName: Build and Push
        pool:
          name: Default
        steps:
          - task: Docker@2
            displayName: Login to Docker Hub
            inputs:
              command: login
              containerRegistry: DockerHubConnection

          - task: Docker@2
            displayName: Build & push backend image
            inputs:
              command: buildAndPush
              dockerfile: backend/Dockerfile
              buildContext: backend
              repository: $(DOCKER_HUB_USERNAME)/antapp-backend
              arguments: --no-cache
              tags: |
                $(IMAGE_TAG)
                latest

          - task: Docker@2
            displayName: Build web image
            inputs:
              command: build
              dockerfile: web/Dockerfile
              buildContext: .
              repository: $(DOCKER_HUB_USERNAME)/antapp-web
              arguments: >
                --no-cache
                --build-arg NEXT_PUBLIC_API_URL=$(NEXT_PUBLIC_API_URL)
                --build-arg NEXT_PUBLIC_APP_URL=$(NEXT_PUBLIC_APP_URL)
              tags: |
                $(IMAGE_TAG)
                latest

          - script: |
              set -e
              docker tag $(DOCKER_HUB_USERNAME)/antapp-web:$(IMAGE_TAG) $(DOCKER_HUB_USERNAME)/antapp-web:latest
              docker images $(DOCKER_HUB_USERNAME)/antapp-web
            displayName: Verify web tags

          - task: Docker@2
            displayName: Push web image
            inputs:
              command: push
              repository: $(DOCKER_HUB_USERNAME)/antapp-web
              tags: |
                $(IMAGE_TAG)
                latest

          - script: |
              docker image prune -f
              docker builder prune -f --keep-storage=4gb
            displayName: Cleanup dangling images on agent
            condition: always()

  - stage: Deploy
    displayName: Deploy to Server
    dependsOn: Build
    jobs:
      - deployment: DeployToServer
        displayName: Deploy
        environment: production
        pool:
          name: Default
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - script: |
                    cp $(Build.SourcesDirectory)/docker-compose.yml /opt/antapp/docker-compose.yml
                  displayName: Update docker-compose.yml

                - script: |
                    set -euo pipefail
                    cd /opt/antapp
                    export DOCKER_HUB_USERNAME=$(DOCKER_HUB_USERNAME)
                    export IMAGE_TAG=$(IMAGE_TAG)

                    echo "Deploying AntAPP images with tag: ${IMAGE_TAG}"
                    docker compose config --images

                    for attempt in 1 2 3; do
                      if docker compose pull backend web; then
                        break
                      fi
                      if [ "$attempt" = "3" ]; then
                        exit 1
                      fi
                      sleep 10
                    done

                    docker compose up -d --force-recreate --remove-orphans backend web
                    docker compose ps backend web
                    docker image prune -af --filter "until=24h"
                    docker builder prune -f --keep-storage=2gb
                  displayName: Pull and restart containers
