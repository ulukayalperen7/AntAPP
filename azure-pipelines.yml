# Azure Pipelines for AntAPP Backend MVP
# This pipeline automates the build and deployment process to Azure Web App.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - backend/*

variables:
  # Azure Resource Manager connection created during pipeline creation
  azureSubscription: 'AntAppAzureConnection'
  # Web app name
  webAppName: 'antapp-api'
  # Environment name
  environmentName: 'production'
  # Agent VM image name
  vmImageName: 'ubuntu-latest'
  # Project root folder
  projectRoot: '$(System.DefaultWorkingDirectory)/backend/CleanArchitecture'

stages:
- stage: Build
  displayName: Build stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)

    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET SDK'
      inputs:
        packageType: 'sdk'
        version: '9.x'

    - task: DotNetCoreCLI@2
      displayName: 'dotnet restore'
      inputs:
        command: 'restore'
        projects: '$(projectRoot)/**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'dotnet build'
      inputs:
        command: 'build'
        projects: '$(projectRoot)/**/*.csproj'
        arguments: '--configuration Release'

    - task: DotNetCoreCLI@2
      displayName: 'dotnet publish'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '$(projectRoot)/CleanArchitecture.WebApi/CleanArchitecture.WebApi.csproj'
        arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)/publish'
        zipAfterPublish: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifact: drop'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/publish'
        ArtifactName: 'drop'
        publishLocation: 'Container'

- stage: Deploy
  displayName: Deploy stage
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: Deploy
    displayName: Deploy
    environment: $(environmentName)
    pool:
      vmImage: $(vmImageName)
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy Azure Web App : antapp-api'
            inputs:
              azureSubscription: $(azureSubscription)
              appType: 'webAppLinux'
              appName: $(webAppName)
              package: '$(Pipeline.Workspace)/drop/**/*.zip'
