trigger:
  branches:
    include:
      - main

variables:
  - group: antapp-prod
  - name: IMAGE_TAG
    value: $(Build.BuildId)

stages:
  - stage: Build
    displayName: Build & Push Docker Images
    jobs:
      - job: BuildAndPush
        displayName: Build and Push
        pool:
          name: Default
        steps:
          - task: Docker@2
            displayName: Login to Docker Hub
            inputs:
              command: login
              containerRegistry: DockerHubConnection

          - task: Docker@2
            displayName: Build backend image
            inputs:
              command: build
              dockerfile: backend/Dockerfile
              buildContext: backend
              repository: $(DOCKER_HUB_USERNAME)/antapp-backend
              tags: |
                $(IMAGE_TAG)
                latest

          - task: Docker@2
            displayName: Push backend image
            inputs:
              command: push
              repository: $(DOCKER_HUB_USERNAME)/antapp-backend
              tags: |
                $(IMAGE_TAG)
                latest

          - task: Docker@2
            displayName: Build web image
            inputs:
              command: build
              dockerfile: web/Dockerfile
              buildContext: .
              repository: $(DOCKER_HUB_USERNAME)/antapp-web
              arguments: >
                --build-arg NEXT_PUBLIC_API_URL=$(NEXT_PUBLIC_API_URL)
                --build-arg NEXT_PUBLIC_APP_URL=$(NEXT_PUBLIC_APP_URL)
              tags: |
                $(IMAGE_TAG)
                latest

          - task: Docker@2
            displayName: Push web image
            inputs:
              command: push
              repository: $(DOCKER_HUB_USERNAME)/antapp-web
              tags: |
                $(IMAGE_TAG)
                latest

  - stage: Deploy
    displayName: Deploy to Server
    dependsOn: Build
    jobs:
      - deployment: DeployToServer
        displayName: Deploy
        environment: production
        pool:
          name: Default
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - script: |
                    cp $(Build.SourcesDirectory)/docker-compose.yml /opt/antapp/docker-compose.yml
                  displayName: Update docker-compose.yml

                - script: |
                    cd /opt/antapp
                    DOCKER_HUB_USERNAME=$(DOCKER_HUB_USERNAME) IMAGE_TAG=$(IMAGE_TAG) docker compose pull
                    DOCKER_HUB_USERNAME=$(DOCKER_HUB_USERNAME) IMAGE_TAG=$(IMAGE_TAG) docker compose up -d --remove-orphans
                  displayName: Pull and restart containers
