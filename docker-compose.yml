services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: antapp-valkey
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - antapp

  backend:
    image: ${DOCKER_HUB_USERNAME}/antapp-backend:${IMAGE_TAG:-latest}
    container_name: antapp-backend
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
      ConnectionStrings__Valkey: "valkey:6379,abortConnect=false"
      Cache__Provider: "Valkey"
      JWTSettings__Key: ${JWT_SECRET}
      JWTSettings__Issuer: AntAppBackend
      JWTSettings__Audience: AntAppUser
      JWTSettings__DurationInMinutes: ${JWT_DURATION_MINUTES:-60}
      MailSettings__EmailFrom: ${MAIL_FROM}
      MailSettings__SmtpHost: ${SMTP_HOST}
      MailSettings__SmtpPort: ${SMTP_PORT:-587}
      MailSettings__SmtpUser: ${SMTP_USER}
      MailSettings__SmtpPass: ${SMTP_PASS}
      MailSettings__DisplayName: ${MAIL_DISPLAY_NAME:-AntApp}
      AllowedOrigins__0: ${WEB_URL}
    ports:
      - "5000:5000"
    networks:
      - antapp
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.antapp-backend.rule=Host(`api.antapp.fun`)"
      - "traefik.http.routers.antapp-backend.entrypoints=https"
      - "traefik.http.routers.antapp-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.antapp-backend.loadbalancer.server.port=5000"
      - "traefik.docker.network=coolify"

  web:
    image: ${DOCKER_HUB_USERNAME}/antapp-web:${IMAGE_TAG:-latest}
    container_name: antapp-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
    ports:
      - "3001:3000"
    networks:
      - antapp
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.antapp-web.rule=Host(`antapp.fun`) || Host(`www.antapp.fun`)"
      - "traefik.http.routers.antapp-web.entrypoints=https"
      - "traefik.http.routers.antapp-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.antapp-web.loadbalancer.server.port=3000"
      - "traefik.docker.network=coolify"

volumes:
  valkey_data:

networks:
  antapp:
    driver: bridge
  coolify:
    external: true
